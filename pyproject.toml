[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "exploom"
version = "0.1.6"
description = "Local single-control-plane Experiment Lineage & Ops for AI Coding Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["experiments", "mlops", "lineage", "mcp", "ssh", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "mcp>=1.2.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/minghuaxu/exploom"
Repository = "https://github.com/minghuaxu/exploom"
Issues = "https://github.com/minghuaxu/exploom/issues"

[project.scripts]
exploom = "exploom.cli:app"
exp = "exploom.cli:app"
exploom-mcp = "exploom.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exploom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
